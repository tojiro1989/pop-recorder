<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>POP Recorder</title><link rel="stylesheet" href="style.css"></head><body><header><div><p class="eyebrow">DOCUMENTAÇÃO VIVA</p><h1>POP Recorder</h1></div><div class="actions"><button id="open" class="secondary">Abrir</button><button id="save" class="secondary">Salvar</button><span id="status">Pronto para gravar</span><button id="record">Iniciar gravação</button><button id="html" class="secondary" disabled>HTML animado</button><button id="pdf" class="secondary" disabled>PDF</button></div></header><main><section class="intro"><h2>Grave seu processo</h2><p>O retângulo destaca o elemento; o círculo indica o ponto exato do clique.</p></section><section id="empty" class="empty">Nenhuma etapa registrada ainda.</section><section id="steps" class="steps" hidden></section></main><template id="step"><article class="step"><div class="step-head"><h3></h3><button class="delete">Excluir</button></div><textarea></textarea><div class="image-wrap"><div class="stage"><img><span class="target-box"></span><span class="ring"></span><span class="hand">👆</span></div></div><small>Arraste o círculo para ajustar o ponto exato do clique.</small></article></template><script src="renderer.js"></script></body></html>
